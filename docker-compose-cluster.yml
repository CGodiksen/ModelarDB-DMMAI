x-aws-variables: &aws-variables
  AWS_ACCESS_KEY_ID: minio_admin
  AWS_SECRET_ACCESS_KEY: ABCDEFGHIJKLMNOPQRSTUVWXYZ1234
  AWS_DEFAULT_REGION: eu-central-1
  AWS_ENDPOINT: http://minio:9000
  AWS_ALLOW_HTTP: true

services:
  create-bucket:
    image: minio/mc
    container_name: create-bucket
    networks:
      - traefik
    # depends_on:
    #   - minio-server
    entrypoint:
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set modelardb-minio http://minio:9000 minio_admin ABCDEFGHIJKLMNOPQRSTUVWXYZ1234;
      /usr/bin/mc mb modelardb-minio/modelardb;
      /usr/bin/mc mb modelardb-minio/datasets;
      /usr/bin/mc mb modelardb-minio/mrsmetadata;
      exit 0;
      "

  # ModelarDB services.
  modelardb-edge-1:
    image: cgodiksen/modelardb
    container_name: modelardb-edge-1
    networks:
      - traefik
    command: [ "target/release/modelardbd", "edge", "data/edge", "s3://modelardb" ]
    ports:
      - "9991:9991"
    environment:
      <<: *aws-variables
      MODELARDBD_IP_ADDRESS: modelardb-edge-1
      MODELARDBD_PORT: 9991
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "echo", "ready" ]
      interval: 2s

  modelardb-edge-2:
    image: cgodiksen/modelardb
    container_name: modelardb-edge-2
    networks:
      - traefik
    command: [ "target/release/modelardbd", "edge", "data/edge", "s3://modelardb" ]
    ports:
      - "9992:9992"
    environment:
      <<: *aws-variables
      MODELARDBD_IP_ADDRESS: modelardb-edge-2
      MODELARDBD_PORT: 9992
    depends_on:
      modelardb-edge-1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "echo", "ready" ]
      interval: 2s

  modelardb-cloud:
    image: cgodiksen/modelardb
    container_name: modelardb-cloud
    networks:
      - traefik
    command: [ "target/release/modelardbd", "cloud", "data/cloud", "s3://modelardb" ]
    ports:
      - "9999:9999"
    environment:
      <<: *aws-variables
      MODELARDBD_IP_ADDRESS: modelardb-cloud
      MODELARDBD_PORT: 9999
    depends_on:
      modelardb-edge-2:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "echo", "ready" ]
      interval: 2s

# One-shot service that uploads the dataset metadata to MinIO and then exits.
  upload-metadata:
    build: ./upload_metadata/.
    image: modelardb-upload-metadata
    container_name: upload-metadata
    networks:
      - traefik
    environment:
      <<: *aws-variables
      METADATA_BUCKET: mrsmetadata
      DATASET_ID: wind-dataset
      DATASET_FILE: /data/wind_cleaned.parquet
    volumes:
      # Adjust to wherever wind_cleaned.parquet lives on the host.
      - ./ingest_data/data:/data:ro
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    restart: "no"

  # Service to ingest data into edge nodes.
  modelardb-ingest:
    build: ./ingest_data/.
    image: modelardb-ingest
    container_name: modelardb-ingest
    networks:
      - traefik
    depends_on:
      modelardb-cloud:
        condition: service_healthy

networks:
  traefik:
    name: traefik_services
    external: true
